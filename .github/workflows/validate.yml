# Gate canônico do Site — SOMENTE validação.
#
# Sem deploy, sem segredos, sem acesso a Supabase ou Vercel. Roda o mesmo
# `npm run validate` usado localmente (legado, typecheck, testes, build do
# Site e build do worker).
name: validate

on:
  pull_request:
  push:
    branches:
      - main
      - "preview/**"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: validate-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          # Histórico completo: o secret-scan compara o diff da série inteira
          # contra a base M1. Em checkout raso essa base não existe e o diff
          # sairia vazio — a etapa passaria sem ter varrido nada.
          fetch-depth: 0

      # Prova que a base histórica do scanner está presente ANTES de rodá-lo;
      # sem isto, um checkout raso faria o diff da série passar em silêncio.
      - name: secret-scan base present
        run: git cat-file -e "${BDFLOW_M1_BASE:-5cf545001367565ff26973eb33f10b6414f9067c}^{commit}"

      - name: secret scan
        run: bash scripts/audit/secret-scan.sh

      # Node 22: runtime declarado do worker (vite.worker.config.ts → node22)
      # e versão de @types/node do repositório.
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - run: npm ci

      - run: npm run validate
